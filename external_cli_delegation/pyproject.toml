[project]
name = "orchid-example-external-cli-delegation"
version = "0.1.0"
description = "External AI-agent CLI delegation example for the Orchid framework"
requires-python = ">=3.11"

dependencies = [
    "orchid-ai>=1.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 120
