# agents.yaml — PostgreSQL storage example
#
# Minimal two-agent setup demonstrating PostgreSQL-backed chat persistence,
# checkpointing, and cross-agent skills.
supervisor:
  assistant_name: Orchid
  prompt: |
    You are a helpful assistant. Route user queries to the appropriate agent.
    Use available tools and skills to answer questions accurately.
  history_max_turns: 20
  history_max_chars: 2000

orchestrator:
  mode: supervisor_agent
  llm: gemini/gemini-flash-latest

agents:
  - name: echo
    description: "Echoes back user messages verbatim. Useful symmetry check for chat persistence."
    type: generic
    skills: [reverse]
    prompt: |
      You are an Echo agent. When a user says something, repeat it back verbatim.
      If the user asks you to reverse text, use the reverse skill.
    tools:
      - name: echo_back
        description: Repeat the user's message back to them
        parameters:
          - name: message
            type: string
            description: The message to echo back
            required: true

      - name: get_current_time
        description: Return the current server time
        parameters: []

    tool_call_strategy: sequential

  - name: reverse
    description: "Text reverser skill. Invoked by other agents via skill routing."
    type: generic
    skills: []
    prompt: |
      You are a Text Reverser. When given text, return it reversed character by character.
    tools:
      - name: reverse_text
        description: Reverse the input text character by character
        parameters:
          - name: text
            type: string
            description: The text to reverse
            required: true

    tool_call_strategy: sequential
