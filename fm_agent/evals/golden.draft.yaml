  # ── Messenger handlers (HYD 3688792065) ──────────────────────────────────
  - id: cf-020
    status: draft
    agent: messenger-expert
    namespace: internal-docs
    question: "What does the Messenger microservice own vs the PaaS Notification service?"
    expected_answer: "Messenger owns CRUD on notification entities in the Hydra DB, plus callbacks for recipient retrieval (immediate + scheduled), shortcode value retrieval, and provisioning of schedules for event-engine setups. PaaS Notification is product-agnostic: it owns meta definitions, tenant setups, and delivery — it deliberately does NOT handle notification filters or recipient types (those are Hydra/LMS business concepts, e.g. the paas_notification_course_filter table with item_id/setup_notification_id lives in Hydra)."
    code_verified: confirmed
    code_refs: [hydra/backend/shared/models/PaasNotificationCourseFilter.php, hydra/backend/migrations/m230328_145827_CREATE_PAAS_NOTIFICATION_TABLES.php]
    expected_source_paths: [confluence/3688792065-messenger-microservice-the-notification-handlers.md]
  - id: cf-021
    status: draft
    agent: messenger-expert
    namespace: internal-docs
    question: "What are the three Messenger callback endpoints and who invokes each?"
    expected_answer: "CallbackAction (/messenger/v1/notification/callback) — Event Bus entry point, builds ImmediateNotificationEvent and rejects event types not in PaasNotificationEventsDictionary. PollingAction (/messenger/v1/scheduler/polling) — invoked by the PaaS Notification Poller; note it returns only {success: bool} — schedules are pushed asynchronously by PollingFunction.sendSchedules() in chunks, not in the HTTP response (doc slightly misleading here). WakeUpAction (/messenger/v1/scheduler/wakeup) — invoked by Notification PaaS for scheduled deliveries, unserializes a SchedulerPubEvent. CallbackAction and WakeUpAction are behind @toggle release/weekly/paas/notifications; PollingAction is not."
    code_verified: partial-doc-corrected
    code_refs: [hydra/backend/apps/messenger/modules/api/v1/actions/notification/CallbackAction.php, hydra/backend/apps/messenger/modules/api/v1/actions/scheduler/PollingAction.php, hydra/backend/apps/messenger/modules/api/v1/functions/PollingFunction.php]
    expected_source_paths: [confluence/3688792065-messenger-microservice-the-notification-handlers.md]
  - id: cf-022
    status: draft
    agent: messenger-expert
    namespace: internal-docs
    question: "What replaced the legacy NotificationJobHandler, and what's the test convention for new notification types?"
    expected_answer: "The handler layer under apps/messenger/components/handler. NotificationHandlerFactory fallbacks: immediate → DefaultHydraImmediateEventHandler; scheduled AND event-provider paths → DefaultHydraScheduledEventProviderHandler (DefaultHydraScheduledEventHandler is a base class concrete handlers extend, never a factory default — doc drift). Per-event override via MessengerNotificationHandlerProvider.registerNotificationHandlerForEvent / EVENT_COLLECT_NOTIFICATION_HANDLER / HandlerCollector registry. NotificationJobHandler survives only as legacy string constants (CoreNotification::NOTIFICATION_JOB_HANDLER_ID) — no class exists. Tests: apps/messenger/tests/functional/suite/components/handler/{NotificationTypeCode}/ (123 folders, e.g. UserSubscribedCourse with Immediate/Scheduled/EventProvider/MultiDomain tests)."
    code_verified: partial-doc-corrected
    code_refs: [hydra/backend/apps/messenger/components/handler/handlers/NotificationHandlerFactory.php, hydra/backend/apps/messenger/components/handler/handlers/HandlerCollector.php, hydra/backend/apps/messenger/tests/functional/suite/components/handler/]
    expected_source_paths: [confluence/3688792065-messenger-microservice-the-notification-handlers.md]

