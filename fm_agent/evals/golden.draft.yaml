    expected_source_paths: [kb/4429113070226-notification-events-and-conditions.md]
  - id: kb-032
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "Is 'ILT event starting' sent when the session has no enrolled learners?"
    expected_answer: "No — the event is not triggered when the session has no enrolled learners. Similarly, 'Decommissioned courses' sends 90 days before decommissioning, and 'User has not logged in' excludes PUs/Superadmins."
