pairs:
  # ── Configuring notifications (360020126259) ────────────────────────────
  - id: kb-001
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "Can I change the event type of a notification after creating it?"
    expected_answer: "No — the event becomes read-only after creation. Duplicate the notification (Timing, Trigger filters, Recipients, Delivery channels can be copied selectively) and pick a new event."
    expected_source_paths: [kb/360020126259-configuring-notifications.md]
  - id: kb-002
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "How many recipient roles can a single notification target?"
    expected_answer: "One role per notification (Users, Power Users, Managers, Instructors, or Superadmins). The only exception is 'Subscription plan has been purchased', which supports Superadmin plus another role. Power User recipients can only be set by a Superadmin."
    expected_source_paths: [kb/360020126259-configuring-notifications.md]
  - id: kb-003
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "What are the mobile push notification length limits?"
    expected_answer: "Title max 50 characters, message max 150 characters — counted AFTER shortcode expansion. Push is only available for a subset of Course and Learning plan events."
    expected_source_paths: [kb/360020126259-configuring-notifications.md]
  - id: kb-004
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "What happens when a customer's custom SMTP server doesn't respond?"
    expected_answer: "If the custom SMTP doesn't respond within 15 seconds the notification is marked Failed and is NOT retried."
    expected_source_paths: [kb/360020126259-configuring-notifications.md]
  - id: kb-005
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "How long are notification delivery logs retained and what export limits apply?"
    expected_answer: "Logs (Queued/Delivered/Failed) are retained 90 days; the filter range is max 14 days within the past 3 months; CSV export is Superadmin-only. In-platform notifications are retained ~90 days."
    expected_source_paths: [kb/360020126259-configuring-notifications.md]
  - id: kb-006
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "What are the Slack delivery channel limits for notifications?"
    expected_answer: "Max 10 Slack channels per notification, delivery throttled by Slack's 1 message/second API limit, queued messages deleted after 7 days."
    expected_source_paths: [kb/360020126259-configuring-notifications.md]
  - id: kb-007
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "Do group and branch trigger filters combine with AND or OR logic?"
    expected_answer: "OR logic — with one exception: 'User subscribed to a group', where branch filters apply with AND logic against group triggers (changed in the new notification service)."
    expected_source_paths: [kb/360020126259-configuring-notifications.md, kb/4429113070226-notification-events-and-conditions.md]

  # ── Transition to the new notification service (22875539857938) ─────────
  - id: kb-010
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "How did shortcode syntax change in the new notification service?"
    expected_answer: "From [square_brackets] to {{double_curly_braces}}; migration converts them automatically. The [calendar_attachment] shortcode was removed — migration strips it and adds a UI-based calendar attachment, which can truncate the message text (manual review needed)."
    expected_source_paths: [kb/22875539857938-transition-to-the-new-notification-service.md]
  - id: kb-011
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "How are out-of-range schedule time frames ported to the new notification service?"
    expected_answer: "They convert to the next larger unit (73 hours → 4 days; 371 days → 53 weeks → 13 months), time set to 00:00. Frames exceeding 24 months are NOT migrated."
    expected_source_paths: [kb/22875539857938-transition-to-the-new-notification-service.md]
  - id: kb-012
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "Why can migrated notifications suddenly fire for ALL courses?"
    expected_answer: "Migrated notifications targeting deleted/inactive courses become unfiltered (global) in the new service — legacy silently didn't send them. Saved by a Superadmin, they then trigger for all courses/learning plans."
    expected_source_paths: [kb/22875539857938-transition-to-the-new-notification-service.md]
  - id: kb-013
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "Why might extended enterprise users receive duplicate notifications after migration, and what's the fix?"
    expected_answer: "Legacy restricted trigger/recipients to the EE client where the notification was saved; the new service does not. Fix: branch trigger filters, or consolidate into one notification using {{extend_enterprise_logo}} — the new service auto-inserts the correct per-recipient base URL."
    expected_source_paths: [kb/22875539857938-transition-to-the-new-notification-service.md]

  # ── Notifications legacy (23030854655890) ───────────────────────────────
  - id: kb-020
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "In legacy notifications, why does 'X days after event' sometimes arrive a day later than expected?"
    expected_answer: "Legacy advances N 24-hour periods from the event, then sends at the next occurrence of the scheduled hour — which can land a day later. Exception: 'Learner has yet to complete a course' uses human days."
    expected_source_paths: [kb/23030854655890-legacy-notifications.md]
  - id: kb-021
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "Why don't ILT session instructors receive 'ILT session starting' notifications?"
    expected_answer: "Instructors are assigned to sessions, not enrolled — the notification reaches only enrolled users, so instructors must also be enrolled as learners to receive it."
    expected_source_paths: [kb/23030854655890-legacy-notifications.md]
  - id: kb-022
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "Which timezones fire legacy scheduled notifications an hour early?"
    expected_answer: "Timezones offset by 30/45 minutes from UTC (IST, ACST, NPT, NST, …); workaround is scheduling one hour forward. Also, 'hours before event' ignores minutes — a 10:30 session with 1-hour notice sends at 9:00."
    expected_source_paths: [kb/23030854655890-legacy-notifications.md]
  - id: kb-023
    status: draft
    agent: notification-expert
    namespace: product-kb
    question: "What are the legacy notification priority SLAs?"
    expected_answer: "Normal priority ≤60 minutes, high priority ≤10 minutes. Scheduled jobs use the base domain the Superadmin was logged into at creation time."
    expected_source_paths: [kb/23030854655890-legacy-notifications.md]

