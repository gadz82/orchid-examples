  - id: cf-001
    status: draft
    agent: notification-expert
    namespace: internal-docs
    question: "How do I enable notifications in my local hydra environment?"
    expected_answer: "Via the wand CLI: `wand notifications install` (plus `clean` and `health`). Prerequisite: your team's AWS ID whitelisted in scripts/commands/notifications.sh of the local-environment repo, and you must be logged into AWS via Leapp (the SQS queue is Terraform-deployed). Install creates a personal SQS queue, a unique DEV ID, a redis identifier variable, a proxy container and a consumer container."
    expected_source_paths: [confluence/4044456058-enable-notifications-in-local-environment.md]
  - id: cf-002
    status: draft
    agent: notification-expert
    namespace: internal-docs
    question: "wand notifications install returns HTTP 403 — what's wrong?"
    expected_answer: "You are not connected to the Leapp AWS account. Related gotcha: SNS 'Subscribe ... StatusCode 400' means wrong region — must be us-east-1."
    expected_source_paths: [confluence/4044456058-enable-notifications-in-local-environment.md]
  - id: cf-003
    status: draft
    agent: notification-expert
    namespace: internal-docs
    question: "Hydra logs show DST token errors when using local notifications — fix?"
    expected_answer: "Set AWS credentials in the redis variables SECRETS_MANAGER_AWS_KEY and SECRETS_MANAGER_AWS_SECRET."
    expected_source_paths: [confluence/4044456058-enable-notifications-in-local-environment.md]

