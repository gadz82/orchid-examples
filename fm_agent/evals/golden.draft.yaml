    expected_answer: "wakeup-producer queries DynamoDB GSI schedules-by-status (pk status, sk wakeup_target_time, boundary now+60s), dedupes (GSI is eventually consistent), claims schedules via conditional Put (compare-and-swap on status+schedule_id), groups by productCode-suiteId-installationId, chunks of 10 → ${envName}-sqs-wakeupQueue.fifo (visibility 900s, RETENTION 15 MIN, maxReceiveCount 10; DLQ is ${envName}-sqs-wakeupDeadLetterQueue.fifo with 14-DAY retention — the 14 days belong to the DLQ, not the main queue). Consumer POSTs meta.webhookCallbackWakeup (from the META, not the product record) with DST auth, CALLBACK_TIMEOUT 300000ms, and dynamically rewrites the EventBridge rule to the next pending schedule time via PutRuleCommand. States (lowercase strings): to_wake_up → processing → waked_up, plus sent and retry_failed (doc omits 'sent'). Fault-tolerance: hourly, but keys off wakeup_target_time <= now - leewayHours (default 1h), RECURRING mode only, recomputes next wakeup AND resets failed_cb_count=0; rule inactive in develop/integration. Retries: non-hourly ≤8 (inclusive) with 2^failedCbCount-minute backoff then reschedule with counter reset; hourly max 4 (2+4+8+16=30 min) — BEFORE/AFTER go to retry_failed, EVERY reschedules. The 1000+2^r*15ms backoff applies only to the claimSchedule DynamoDB path (generic batch writes use 2^r*15 without the base). It's not a Step Functions state machine — pure enum + conditional writes."
