  # ── Messenger architecture & validation (HYD 3686269080, 3688890498, 3687350290, 3687022702) ──
  - id: cf-040
    status: draft
    agent: messenger-expert
    namespace: internal-docs
    question: "How does LMS code trigger a PaaS notification event, and what gates it?"
