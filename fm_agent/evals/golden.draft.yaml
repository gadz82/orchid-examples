  # ── Email sender domains (14656947588114) ───────────────────────────────
  - id: kb-060
    status: draft
    agent: domains-expert
    namespace: product-kb
    question: "How many email sender domains can a platform have, and which domain levels?"
    expected_answer: "Up to 500 email sender domains, levels 2nd–5th. @docebo.com sender addresses can no longer be used. Menu: Configuration > Platform setup and tools > Domain management > Email sender domains."
    expected_source_paths: [kb/14656947588114-domain-management-configuring-email-domains.md]
  - id: kb-061
    status: draft
    agent: domains-expert
    namespace: product-kb
    question: "Why must the email sender domain differ from the custom/secondary domain?"
    expected_answer: "CNAME (custom domain) and SPF (sender domain) DNS records conflict on the same name — use a sibling or 4th-level domain for senders. Docebo won't investigate delivery issues for domains lacking SPF, DKIM and MX records."
    expected_source_paths: [kb/14656947588114-domain-management-configuring-email-domains.md, kb/360020084060-managing-the-custom-domain-app.md]
  - id: kb-062
    status: draft
    agent: domains-expert
    namespace: product-kb
    question: "Which SMTP encryption/port pairing should Microsoft 365 users choose?"
    expected_answer: "StartTLS on port 587 (TLS implicit is port 465) — wrong pairing fails the connection test. Re-testing after save requires re-entering the SMTP password or using ellipsis > Check validation. Microsoft 365 SMTP is discouraged for high volume."
    expected_source_paths: [kb/14656947588114-domain-management-configuring-email-domains.md]
  - id: kb-063
    status: draft
    agent: domains-expert
    namespace: product-kb
    question: "What happens to email delivery if a sender domain is deleted?"
    expected_answer: "Its emails route through the untrusted SMTP gateway with no delivery guarantee."
    expected_source_paths: [kb/14656947588114-domain-management-configuring-email-domains.md]

