[project]
name = "orchid-example-fm-agent"
version = "0.1.0"
description = "FM Agent — personal AI assistant fleet for the Orchid framework"
requires-python = ">=3.11"

dependencies = [
    "orchid-api>=1.8.2",
    "orchid-ai[documents,events]>=1.8.6",
    "orchid-rag-qdrant>=0.1.0",
    "orchid-storage-postgres>=0.1.0",
    "orchid-rag-neo4j>=0.1.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "pyyaml>=6.0",
]

[project.scripts]
fm-indexer = "examples.fm_agent.indexer.cli:main"

[project.entry-points."orchid_api.routers"]
fm_indexer = "examples.fm_agent.indexer_router:router"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples.fm_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Docker",
]

[tool.ruff]
target-version = "py311"
line-length = 120
