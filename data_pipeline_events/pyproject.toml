[project]
name = "orchid-example-data-pipeline-events"
version = "0.1.0"
description = "Event-driven typed data-pipeline demo for the Orchid framework"
requires-python = ">=3.11"

dependencies = [
    "orchid-ai[events]>=1.12.1",
    "orchid-api>=1.9.1",
    "orchid-storage-sqlite>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline_events"]

[tool.ruff]
target-version = "py311"
line-length = 120
