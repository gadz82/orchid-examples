[project]
name = "orchid-example-car-dealer-fleet"
version = "0.1.0"
description = "Car dealer fleet management demo for the Orchid framework"
requires-python = ">=3.11"

dependencies = [
    "orchid-api>=1.8.2",
    "orchid-ai[documents]>=1.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120
