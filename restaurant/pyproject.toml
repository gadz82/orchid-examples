[project]
name = "orchid-example-restaurant"
version = "0.1.0"
description = "Restaurant multi-agent demo for the Orchid framework (RAG + sequential routing)"
requires-python = ">=3.11"

dependencies = [
    "orchid-api>=1.5.0",
    "orchid-rag-qdrant>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["restaurant"]

[tool.ruff]
target-version = "py311"
line-length = 120
