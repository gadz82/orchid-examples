# docker-compose.yml — MCP Auth example
#
# Services: agents-api, frontend, orchid-mcp
# Storage: SQLite (no Qdrant — no RAG backend)
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# API:    http://localhost:8080
# UI:     http://localhost:3000
# MCP:    http://localhost:9000/mcp

services:

  agents-api:
    build:
      context: .
    ports: ["8080:8000"]
    env_file: .env
    environment:
      ORCHID_CONFIG: examples/mcp-auth/orchid.yml
    volumes:
      - chat_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../_docker
      dockerfile: Dockerfile.frontend
    ports: ["3000:3000"]
    environment:
      AGENTS_API_URL: http://agents-api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      agents-api:
        condition: service_healthy

  orchid-mcp:
    build:
      context: ../_docker
      dockerfile: Dockerfile.mcp
    ports: ["9000:9000"]
    depends_on:
      agents-api:
        condition: service_healthy
    environment:
      ORCHID_MCP_ORCHID_API_URL: http://agents-api:8000
      ORCHID_MCP_SERVICE_ACCOUNT_TOKEN: ${MCP_TOKEN:-demo-token}
      ORCHID_MCP_I_UNDERSTAND_THE_RISK: "true"
      ORCHID_MCP_LOG_LEVEL: info

volumes:
  chat_data:
