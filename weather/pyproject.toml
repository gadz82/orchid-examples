[project]
name = "orchid-example-weather"
version = "0.1.0"
description = "Weather agentic fleet demo for the Orchid framework"
requires-python = ">=3.11"

dependencies = [
    "orchid-api>=1.8.2",
    "orchid-ai[documents,events]>=1.8.6",
    "orchid-rag-qdrant>=0.1.0",
    "orchid-storage-postgres>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weather"]

[tool.ruff]
target-version = "py311"
line-length = 120
